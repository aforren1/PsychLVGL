# Which LVGL functions become PsychLVGL subcommands. SPEC section 5.3.
#
# A function listed here is still dropped when its signature uses a type the
# SPEC 7.3 rules cannot marshal; generate.py prints every drop.

[rules]
style_setters = true           # include all lv_obj_set_style_*
exclude_suffix = ["_static"]   # lv_label_set_text_static keeps the caller buffer

[widgets.obj]
functions = [
  "lv_obj_create", "lv_obj_set_pos", "lv_obj_set_x", "lv_obj_set_y",
  "lv_obj_set_size", "lv_obj_set_width", "lv_obj_set_height",
  "lv_obj_align", "lv_obj_align_to", "lv_obj_center", "lv_obj_set_parent",
  "lv_obj_add_flag", "lv_obj_remove_flag", "lv_obj_has_flag",
  "lv_obj_add_state", "lv_obj_remove_state", "lv_obj_has_state",
  "lv_obj_get_x", "lv_obj_get_y", "lv_obj_get_width", "lv_obj_get_height",
  "lv_obj_get_child_count", "lv_obj_get_child", "lv_obj_get_parent",
  "lv_obj_invalidate", "lv_obj_scroll_to_view",
  "lv_obj_set_flex_flow", "lv_obj_set_flex_align", "lv_obj_set_layout",
]

[widgets.label]
functions = [
  "lv_label_create", "lv_label_set_text", "lv_label_set_long_mode",
  "lv_label_get_text",
]

[widgets.button]
functions = ["lv_button_create"]

[widgets.slider]
functions = [
  "lv_slider_create", "lv_slider_set_value", "lv_slider_set_range",
  "lv_slider_set_mode", "lv_slider_get_value", "lv_slider_get_min_value",
  "lv_slider_get_max_value",
  # lv_slider_set_left_value from SPEC 5.3 is lv_slider_set_start_value in 9.6
  "lv_slider_set_start_value", "lv_slider_get_left_value",
  "lv_slider_set_orientation", "lv_slider_get_mode",
]

[widgets.switch]
functions = ["lv_switch_create"]

[widgets.checkbox]
functions = ["lv_checkbox_create", "lv_checkbox_set_text", "lv_checkbox_get_text"]

[widgets.bar]
functions = [
  "lv_bar_create", "lv_bar_set_value", "lv_bar_set_range",
  "lv_bar_set_start_value", "lv_bar_get_value", "lv_bar_set_mode",
]

[widgets.arc]
functions = [
  "lv_arc_create", "lv_arc_set_value", "lv_arc_set_range",
  "lv_arc_set_bg_angles", "lv_arc_set_angles", "lv_arc_set_rotation",
  "lv_arc_set_mode", "lv_arc_get_value",
]

[widgets.dropdown]
functions = [
  "lv_dropdown_create", "lv_dropdown_set_options", "lv_dropdown_add_option",
  "lv_dropdown_clear_options", "lv_dropdown_set_selected",
  "lv_dropdown_get_selected", "lv_dropdown_get_selected_str",
  "lv_dropdown_set_text", "lv_dropdown_set_dir", "lv_dropdown_open",
  "lv_dropdown_close",
]

[widgets.roller]
functions = [
  "lv_roller_create", "lv_roller_set_options", "lv_roller_set_selected",
  "lv_roller_get_selected", "lv_roller_get_selected_str",
  "lv_roller_set_visible_row_count",
]

[widgets.textarea]
functions = [
  "lv_textarea_create", "lv_textarea_set_text", "lv_textarea_add_text",
  "lv_textarea_add_char", "lv_textarea_delete_char", "lv_textarea_get_text",
  "lv_textarea_set_placeholder_text", "lv_textarea_set_one_line",
  "lv_textarea_set_password_mode", "lv_textarea_set_max_length",
  "lv_textarea_set_accepted_chars", "lv_textarea_set_cursor_pos",
  "lv_textarea_get_cursor_pos",
]

[widgets.spinbox]
functions = [
  "lv_spinbox_create", "lv_spinbox_set_value", "lv_spinbox_set_range",
  "lv_spinbox_set_digit_format", "lv_spinbox_set_step",
  "lv_spinbox_increment", "lv_spinbox_decrement", "lv_spinbox_get_value",
]

[widgets.table]
functions = [
  "lv_table_create", "lv_table_set_cell_value", "lv_table_set_row_count",
  "lv_table_set_column_count", "lv_table_set_column_width",
  "lv_table_get_selected_cell", "lv_table_get_cell_value",
]
